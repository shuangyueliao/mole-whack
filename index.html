<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Mole Whack — 30-second whack-a-mole arcade game with combos, golden moles and bombs. Free HTML5 game.">
<title>Mole Whack · Whack-a-Mole Arcade</title>
<script>
// 平台 SDK 按域名条件加载（独立运行时完全不加载，游戏行为不变）
(function () {
  var host = location.hostname || "";
  try {
    if (host.indexOf("crazygames") !== -1) {
      var s1 = document.createElement("script");
      s1.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
      s1.onload = function () {
        if (window.CrazyGames && window.CrazyGames.SDK) {
          window.CrazyGames.SDK.init().then(function () {
            try { window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}
            window.addEventListener("load", function () { try { window.CrazyGames.SDK.game.loadingStop(); } catch (e) {} });
          }).catch(function () {});
        }
      };
      document.head.appendChild(s1);
      window.__portal = "crazygames";
    } else if (host.indexOf("gamedistribution") !== -1 || host.indexOf("html5.gamedistribution.com") !== -1 || host.indexOf("gd.games") !== -1) {
      var s2 = document.createElement("script");
      s2.src = "https://sdk.gamedistribution.com/v2/main.min.js";
      document.head.appendChild(s2);
      window.__portal = "gamedistribution";
    }
  } catch (e) {}
})();
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#12200f; font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #hud { width:100%; max-width:480px; display:flex; justify-content:space-around; align-items:center; padding:8px 8px 6px; color:#eaf5e6; }
  .stat { text-align:center; min-width:62px; }
  .stat .label { font-size:10px; color:#9dbb92; letter-spacing:2px; }
  .stat .val { font-size:20px; font-weight:800; }
  #combo { color:#ffd75e; }
  #stage { position:relative; width:100%; max-width:480px; }
  canvas { display:block; width:100%; height:auto; max-width:100%; max-height:calc(100vh - 116px); border-radius:14px;
    touch-action:none; box-shadow:0 10px 40px rgba(0,0,0,.45); margin:0 auto; }
  #muteBtn { position:absolute; top:10px; right:10px; z-index:6; background:rgba(18,38,14,.5); color:#eaf5e6;
    border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:6px 12px; font-size:10px; font-weight:700;
    letter-spacing:1px; cursor:pointer; backdrop-filter:blur(4px); }
  #muteBtn:active { transform:scale(.96); }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(10,22,8,.62); backdrop-filter:blur(3px); z-index:5; }
  #panel { background:#1a2c15; border:1px solid #35522c; border-radius:20px; padding:24px 30px 22px; text-align:center;
    color:#fff; width:min(330px,86vw); box-shadow:0 18px 50px rgba(0,0,0,.5); }
  #panel h1 { font-size:33px; font-weight:900; letter-spacing:3px; line-height:1.1; margin-bottom:8px;
    background:linear-gradient(180deg,#ffe27a,#8fd66a); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  #panel h2 { font-size:22px; font-weight:900; letter-spacing:2px; color:#ffd75e; margin-bottom:10px; }
  #panel .tag { color:#a9c8a0; font-size:12.5px; line-height:1.55; margin-bottom:14px; }
  .legend { text-align:left; margin:0 auto 14px; width:-moz-fit-content; width:fit-content; }
  .legend .li { color:#dcecd4; font-size:13px; margin:5px 0; }
  .legend .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:8px; vertical-align:-1px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.3); }
  .legend b { color:#ffd75e; }
  .bestline { color:#8fe3b0; font-size:12.5px; font-weight:700; letter-spacing:1px; margin-bottom:16px; }
  .finalLabel { color:#9dbb92; font-size:11px; letter-spacing:3px; }
  .final { font-size:40px; font-weight:900; color:#ffd75e; line-height:1.15; margin-bottom:8px; }
  #rankLetter { width:64px; height:64px; margin:2px auto 0; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:34px; font-weight:900; color:#fff; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .rankLabel { color:#9dbb92; font-size:10px; letter-spacing:3px; margin-top:5px; margin-bottom:12px; }
  .bestRow { color:#cfe4c6; font-size:13.5px; font-weight:700; margin-bottom:14px; letter-spacing:1px; }
  .newBest { display:inline-block; background:#ff5d5d; color:#fff; border-radius:6px; font-size:10px; font-weight:800;
    padding:2px 7px; margin-left:6px; vertical-align:2px; letter-spacing:1px; }
  .bigBtn { background:linear-gradient(135deg,#9ed455,#5aa832); color:#fff; border:none; border-radius:12px;
    padding:12px 40px; font-size:16px; font-weight:800; letter-spacing:2px; cursor:pointer;
    box-shadow:0 6px 16px rgba(90,168,50,.35); }
  .bigBtn:active { transform:scale(.97); }
  #footer { color:#6b8a5e; font-size:11px; padding:6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat"><div class="label">SCORE</div><div class="val" id="score">0</div></div>
    <div class="stat"><div class="label">TIME</div><div class="val" id="time">30</div></div>
    <div class="stat"><div class="label">COMBO</div><div class="val" id="combo">0</div></div>
    <div class="stat"><div class="label">BEST</div><div class="val" id="best">0</div></div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <button id="muteBtn" aria-pressed="false">SOUND ON</button>
    <div id="overlay"><div id="panel">
      <div id="menuView">
        <h1>MOLE WHACK</h1>
        <p class="tag">Whack moles for 30 seconds!<br>Chain hits to build your combo multiplier.</p>
        <div class="legend">
          <div class="li"><span class="dot" style="background:#a9744f"></span>Normal mole <b>+1</b></div>
          <div class="li"><span class="dot" style="background:#ffd75e"></span>Gold mole <b>+3</b></div>
          <div class="li"><span class="dot" style="background:#26262e"></span>Bomb <b>-5</b> &amp; combo break</div>
        </div>
        <div class="bestline" id="menuBest">BEST 0</div>
        <button id="playBtn" class="bigBtn">PLAY</button>
      </div>
      <div id="overView" style="display:none">
        <h2>TIME'S UP!</h2>
        <div class="finalLabel">SCORE</div>
        <div class="final" id="finalScore">0</div>
        <div id="rankLetter">F</div>
        <div class="rankLabel">RANK</div>
        <div class="bestRow" id="overBest">BEST 0</div>
        <button id="playBtn2" class="bigBtn">PLAY AGAIN</button>
      </div>
    </div></div>
  </div>
  <div id="footer">Mole Whack — a free arcade game</div>
</div>
<script>
"use strict";
// ---------- 画布与常量 ----------
var W = 480, H = 720;
var TOTAL_TIME = 30;                 // 一局 30 秒（基于 dt 累计，避免 setInterval 漂移）
var RISE_T = 0.11, HIDE_T = 0.12, HIT_T = 0.1;
var HAMMER_LIFE = 0.22;
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr; canvas.height = H * dpr;
canvas.style.width = "100%"; canvas.style.maxWidth = W + "px";
ctx.scale(dpr, dpr);

// 3×3 洞口（行优先：地鼠不会重叠——每个洞同时最多一只）
var holes = [];
(function () {
  for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++)
    holes.push({ x: 90 + c * 150, y: 282 + r * 148 });
})();
function nearHole(x, y) {
  for (var i = 0; i < 9; i++) { var dx = x - holes[i].x, dy = y - holes[i].y; if (dx*dx + dy*dy < 80*80) return true; }
  return false;
}
// 草丛 / 小花点缀（避开洞口区域）
var tufts = [], flowers = [], guard = 0;
while (tufts.length < 46 && guard++ < 500) {
  var tx = Math.random()*W, ty = 158 + Math.random()*(H-170);
  if (!nearHole(tx, ty)) tufts.push({ x:tx, y:ty, s:5+Math.random()*7, d:Math.random()<0.5 });
}
guard = 0;
while (flowers.length < 9 && guard++ < 300) {
  var fx2 = Math.random()*W, fy2 = 170 + Math.random()*(H-190);
  if (!nearHole(fx2, fy2)) flowers.push({ x:fx2, y:fy2, c:Math.random()<0.5?"#ffffff":"#ffd75e" });
}
var clouds = [ {x:60,y:56,s:1,v:7}, {x:250,y:96,s:0.7,v:10}, {x:400,y:44,s:0.85,v:5.5} ];

// ---------- 状态 ----------
var state = "MENU"; // MENU | PLAY | OVER
var score = 0, combo = 0, best = 0, bestRank = "-";
var moles = [], particles = [], floats = [];
var timeLeft = TOTAL_TIME, lastSec = -1;
var spawnT = 0.6, ambT = 0.4;
var shakeT = 0, flashT = 0;
var hammer = { x: W/2, y: H/2, t: 9 };
var muted = false;
try { best = parseInt(localStorage.getItem("mw_best") || "0", 10) || 0; } catch (e) {}
try { bestRank = localStorage.getItem("mw_best_rank") || "-"; } catch (e) {}
try { if (localStorage.getItem("mw_mute") === "1") muted = true; } catch (e) {}

var scoreEl = document.getElementById("score"), timeEl = document.getElementById("time");
var comboEl = document.getElementById("combo"), bestEl = document.getElementById("best");
var overlay = document.getElementById("overlay");
var menuView = document.getElementById("menuView"), overView = document.getElementById("overView");
var menuBestEl = document.getElementById("menuBest"), finalScoreEl = document.getElementById("finalScore");
var rankLetterEl = document.getElementById("rankLetter"), overBestEl = document.getElementById("overBest");
var muteBtn = document.getElementById("muteBtn");

// ---------- 音效（WebAudio 合成，四种 + 开始音） ----------
var actx = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function tone(f0, f1, dur, type, gainv, delay) {
  try {
    if (muted || !actx) return;
    if (actx.state === "suspended") actx.resume();
    var t0 = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    g.gain.setValueAtTime(gainv || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function sHit()   { tone(320, 120, 0.1, "triangle", 0.18); tone(150, 90, 0.09, "square", 0.07); }
function sGold()  { tone(740, 740, 0.09, "sine", 0.12); tone(1108, 1108, 0.1, "sine", 0.12, 0.07); tone(1480, 1480, 0.16, "sine", 0.11, 0.14); }
function sBomb()  { tone(150, 36, 0.42, "sawtooth", 0.22); tone(96, 30, 0.45, "square", 0.14); }
function sWhiff() { tone(430, 170, 0.08, "sine", 0.06); }
function sStart() { tone(520, 780, 0.14, "triangle", 0.1); }

// ---------- 工具 ----------
function rr(c, x, y, w, h, rad) {
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}
function easeOut(t) { return 1 - (1 - t) * (1 - t) * (1 - t); }
function drawStarShape(x, y, r, rot, color, alpha) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  for (var i = 0; i < 8; i++) {
    var rad = (i % 2 === 0) ? r : r * 0.42, a = i * Math.PI / 4 - Math.PI / 2;
    if (i === 0) ctx.moveTo(Math.cos(a)*rad, Math.sin(a)*rad); else ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---------- 特效 ----------
function starBurst(x, y, n, colors, big) {
  for (var i = 0; i < n; i++) {
    var a = Math.random()*Math.PI*2, s = 60 + Math.random()*160;
    particles.push({ kind:"spark", x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 60,
      life:0.45 + Math.random()*0.25, maxLife:0.7, size:(big?5:4) + Math.random()*4,
      rot:Math.random()*Math.PI, vr:Math.random()*8 - 4, color:colors[Math.floor(Math.random()*colors.length)] });
  }
}
function boomFX(x, y) {
  for (var i = 0; i < 10; i++) {
    particles.push({ kind:"smoke", x:x + (Math.random()*36-18), y:y + (Math.random()*28-14),
      vx:Math.random()*60 - 30, vy:-20 - Math.random()*50, life:0.5 + Math.random()*0.3, maxLife:0.8,
      size:8 + Math.random()*10, rot:0, vr:0, color:Math.random()<0.5 ? "#5a5a64" : "#8a8a94" });
  }
  starBurst(x, y, 10, ["#ff9d3c", "#ff5d3c", "#ffd75e"], true);
  flashT = 0.35; shakeT = 0.4;
}
function goldSpark(m) {
  particles.push({ kind:"spark", x:m.holeRef.x + Math.random()*40 - 20, y:m.holeRef.y - 20 - Math.random()*44,
    vx:Math.random()*20 - 10, vy:-24, life:0.5, maxLife:0.5, size:3 + Math.random()*2.5,
    rot:Math.random()*Math.PI, vr:3, color:"#ffe27a" });
}

// ---------- 地鼠生成（每洞最多一只，杜绝重叠） ----------
function activeCount() {
  var n = 0;
  for (var i = 0; i < moles.length; i++) if (moles[i].phase !== "hit") n++;
  return n;
}
function spawnMole(progress, ambient) {
  var empty = [];
  for (var i = 0; i < 9; i++) {
    var used = false;
    for (var k = 0; k < moles.length; k++) if (moles[k].holeRef === holes[i]) { used = true; break; }
    if (!used) empty.push(holes[i]);
  }
  if (!empty.length) return;
  var hole = empty[Math.floor(Math.random()*empty.length)];
  var type = "normal";
  if (!ambient) {
    var r = Math.random(), bombP = 0.13 + progress*0.05;   // 炸弹 13%→18%
    if (r < bombP) type = "bomb";
    else if (r < bombP + 0.16) type = "gold";               // 金鼠 16%
  } else if (Math.random() < 0.2) type = "gold";
  // 停留时间：开局 900ms → 后期 450ms
  var stay = ambient ? 0.55 + Math.random()*0.4 : 0.9 - 0.45*progress;
  moles.push({ holeRef:hole, type:type, phase:"rise", p:0, t:0, stay:stay, p0:1 });
}

// ---------- 命中逻辑 ----------
function hitMole(m) {
  var hx = m.holeRef.x, hy = m.holeRef.y, fy = hy - 40;
  m.phase = "hit"; m.t = 0; m.p0 = m.p;
  if (m.type === "bomb") {
    combo = 0;
    score = Math.max(0, score - 5);
    floats.push({ x:hx, y:fy, text:"-5", color:"#ff6b5e", life:0.9, size:24 });
    floats.push({ x:hx, y:fy - 26, text:"COMBO LOST", color:"#ffb0a8", life:0.8, size:12 });
    boomFX(hx, hy - 20);
    sBomb();
  } else {
    var mult = 1 + Math.min(combo, 10) * 0.1;               // 乘数 = 1 + min(combo,10)×0.1
    var gain = Math.round((m.type === "gold" ? 3 : 1) * mult);
    score += gain;
    combo++;
    floats.push({ x:hx, y:fy, text:"+" + gain, color:m.type === "gold" ? "#ffd75e" : "#ffffff",
      life:0.7, size:m.type === "gold" ? 26 : 20 });
    if (m.type === "gold") { starBurst(hx, hy - 30, 14, ["#ffd75e", "#fff3b0", "#ffb400"], true); sGold(); }
    else { starBurst(hx, hy - 30, 9, ["#ffffff", "#fff3b0", "#ffe27a"], false); sHit(); }
  }
  scoreEl.textContent = String(score);
  comboEl.textContent = String(combo);
}
function missWhack(x, y) {
  if (combo > 0) floats.push({ x:x, y:y - 14, text:"MISS", color:"#d8d8d8", life:0.6, size:15 });
  combo = 0; comboEl.textContent = "0";
  sWhiff();
}
function whack(x, y) {
  hammer.x = x; hammer.y = y; hammer.t = 0;
  if (state !== "PLAY") return;
  var target = null, bestP = -1;
  for (var i = 0; i < moles.length; i++) {
    var m = moles[i];
    if (m.phase === "hit" || m.p < 0.3) continue;
    var hx = m.holeRef.x, hy = m.holeRef.y;
    // 宽容判定：略大于地鼠本体的矩形（±47 宽，头顶再放 26px）
    if (Math.abs(x - hx) <= 47 && y >= hy - 74*m.p - 26 && y <= hy + 14 && m.p > bestP) {
      bestP = m.p; target = m;
    }
  }
  if (target) hitMole(target); else missWhack(x, y);
}

// ---------- 流程 ----------
function saveBest() {
  try { localStorage.setItem("mw_best", String(best)); localStorage.setItem("mw_best_rank", bestRank); } catch (e) {}
}
function ratingOf(s) { return s >= 85 ? "S" : s >= 60 ? "A" : s >= 42 ? "B" : s >= 26 ? "C" : s >= 12 ? "D" : "F"; }
var RANKS = ["F", "D", "C", "B", "A", "S"];
var RANK_COLORS = { F:"#7a8a75", D:"#e08a3c", C:"#35b8a6", B:"#4a90d9", A:"#58c14c", S:"#ffb400" };

function startGame() {
  score = 0; combo = 0; timeLeft = TOTAL_TIME; lastSec = -1;
  moles = []; particles = []; floats = [];
  spawnT = 0.55; shakeT = 0; flashT = 0; hammer.t = 9;
  scoreEl.textContent = "0"; comboEl.textContent = "0";
  state = "PLAY";
  overlay.style.display = "none";
  floats.push({ x:W/2, y:H*0.42, text:"GO!", color:"#ffd75e", life:0.9, size:44 });
  ensureAudio(); sStart();
  // 平台埋点：一局开始
  try { if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) window.CrazyGames.SDK.game.gameplayStart(); } catch (e) {}
}
function endGame() {
  state = "OVER";
  timeLeft = 0;
  var r = ratingOf(score), newBest = false;
  if (score > best) { best = score; bestRank = r; newBest = true; saveBest(); }
  else if (score === best && RANKS.indexOf(r) > RANKS.indexOf(bestRank)) { bestRank = r; saveBest(); }
  moles = []; lastSec = -1;
  bestEl.textContent = String(best);
  finalScoreEl.textContent = String(score);
  rankLetterEl.textContent = r;
  rankLetterEl.style.background = RANK_COLORS[r];
  overBestEl.innerHTML = "BEST " + best + (newBest ? '<span class="newBest">NEW BEST!</span>' : "");
  menuBestEl.textContent = "BEST " + best + (bestRank !== "-" ? " · RANK " + bestRank : "");
  menuView.style.display = "none"; overView.style.display = "block";
  overlay.style.display = "flex";
  // 平台埋点：一局结束
  try {
    if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
      window.CrazyGames.SDK.game.gameplayStop();
      window.CrazyGames.SDK.game.happytime();
    }
  } catch (e) {}
}
function updateClock() {
  var sec = Math.ceil(timeLeft);
  if (sec !== lastSec) {
    lastSec = sec;
    timeEl.textContent = String(sec);
    timeEl.style.color = sec <= 5 ? "#ff5d5d" : "#eaf5e6";
  }
}

// ---------- 更新 ----------
function update(dt) {
  for (var i = 0; i < clouds.length; i++) { clouds[i].x += clouds[i].v * dt; if (clouds[i].x > W + 90) clouds[i].x = -90; }
  if (shakeT > 0) shakeT -= dt;
  if (flashT > 0) flashT -= dt;
  hammer.t += dt;

  if (state === "PLAY") {
    timeLeft -= dt;                                        // dt 累计计时，无 setInterval 漂移
    if (timeLeft <= 0) { timeLeft = 0; updateClock(); endGame(); }
    else {
      updateClock();
      var progress = (TOTAL_TIME - timeLeft) / TOTAL_TIME;
      spawnT -= dt;
      if (spawnT <= 0) {
        if (activeCount() < 3 + Math.floor(progress * 2.9)) spawnMole(progress, false);
        spawnT = (0.62 - 0.24*progress) * (0.8 + Math.random()*0.4);
      }
    }
  } else {
    // 菜单 / 结算：环境地鼠探头（不可交互，纯气氛）
    ambT -= dt;
    if (ambT <= 0) { spawnMole(0, true); ambT = 0.8 + Math.random()*0.9; }
  }

  for (var m = moles.length - 1; m >= 0; m--) {
    var M = moles[m];
    M.t += dt;
    if (M.phase === "rise") { M.p = M.t / RISE_T; if (M.p >= 1) { M.p = 1; M.phase = "up"; M.t = 0; } }
    else if (M.phase === "up") {
      if (M.t >= M.stay) { M.phase = "hide"; M.t = 0; }
      else if (M.type === "gold" && Math.random() < dt*7) goldSpark(M);
    }
    else if (M.phase === "hide") { M.p = 1 - M.t / HIDE_T; if (M.p <= 0) moles.splice(m, 1); }
    else if (M.phase === "hit") { M.p = M.p0 * (1 - M.t / HIT_T); if (M.t >= HIT_T) moles.splice(m, 1); }
  }

  for (var p = particles.length - 1; p >= 0; p--) {
    var pt = particles[p]; pt.life -= dt;
    if (pt.life <= 0) { particles.splice(p, 1); continue; }
    pt.x += pt.vx*dt; pt.y += pt.vy*dt;
    pt.vy += (pt.kind === "smoke" ? -40 : 300) * dt;
    pt.rot += pt.vr*dt;
  }
  for (var f = floats.length - 1; f >= 0; f--) {
    var fl = floats[f]; fl.life -= dt; fl.y -= 46*dt;
    if (fl.life <= 0) floats.splice(f, 1);
  }
}

// ---------- 渲染 ----------
function drawCloud(c) {
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
  ctx.fillStyle = "rgba(255,255,255,.92)";
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.arc(22, 4, 15, 0, Math.PI*2); ctx.arc(-22, 6, 14, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function drawTuft(t) {
  ctx.strokeStyle = t.d ? "#2f7a2c" : "#5cb04a";
  ctx.lineWidth = 2; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(t.x, t.y); ctx.lineTo(t.x - 4, t.y - t.s);
  ctx.moveTo(t.x, t.y); ctx.lineTo(t.x + 0.5, t.y - t.s*1.25);
  ctx.moveTo(t.x, t.y); ctx.lineTo(t.x + 5, t.y - t.s*0.9);
  ctx.stroke();
}
function drawFlower(f) {
  ctx.fillStyle = f.c;
  for (var k = 0; k < 4; k++) {
    var a = k * Math.PI/2 + 0.6;
    ctx.beginPath(); ctx.arc(f.x + Math.cos(a)*3, f.y + Math.sin(a)*3, 2.6, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = "#e8a33c";
  ctx.beginPath(); ctx.arc(f.x, f.y, 2, 0, Math.PI*2); ctx.fill();
}
function drawCritter(cx, cy, m) {
  var hit = m.phase === "hit" ? Math.min(1, m.t / HIT_T) : 0;
  var gold = m.type === "gold";
  ctx.save();
  ctx.translate(cx, cy);
  if (hit) { ctx.translate(0, 10*hit); ctx.scale(1 + 0.18*hit, 1 - 0.3*hit); }  // 被打扁
  // 耳朵
  ctx.fillStyle = gold ? "#eab545" : "#9a6740";
  ctx.beginPath(); ctx.arc(-19, -27, 8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(19, -27, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = gold ? "#c98f2c" : "#c98a86";
  ctx.beginPath(); ctx.arc(-19, -27, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(19, -27, 4, 0, Math.PI*2); ctx.fill();
  // 发光圆滚滚身体
  ctx.shadowColor = gold ? "rgba(255,208,74,.85)" : "rgba(255,220,150,.35)";
  ctx.shadowBlur = gold ? 18 : 8;
  var g = ctx.createLinearGradient(0, -34, 0, 34);
  if (gold) { g.addColorStop(0, "#ffdf7e"); g.addColorStop(1, "#dfa325"); }
  else { g.addColorStop(0, "#b07a52"); g.addColorStop(1, "#84552f"); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, 31, 32, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  // 肚皮
  ctx.fillStyle = gold ? "rgba(255,246,205,.5)" : "rgba(233,200,160,.4)";
  ctx.beginPath(); ctx.ellipse(0, 16, 16, 12, 0, 0, Math.PI*2); ctx.fill();
  // 眼睛（表情差异：普通圆眼 / 金鼠得意眯眼 / 被打晕 XX）
  if (gold) {
    ctx.strokeStyle = "#5b3a10"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(-12, -8, 5, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(12, -8, 5, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
  } else {
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-12, -8, 7.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(12, -8, 7.5, 0, Math.PI*2); ctx.fill();
    if (hit) {
      ctx.strokeStyle = "#3a2412"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-15, -11); ctx.lineTo(-9, -5); ctx.moveTo(-9, -11); ctx.lineTo(-15, -5);
      ctx.moveTo(9, -11); ctx.lineTo(15, -5); ctx.moveTo(15, -11); ctx.lineTo(9, -5);
      ctx.stroke();
    } else {
      ctx.fillStyle = "#2e1c0e";
      ctx.beginPath(); ctx.arc(-11, -7, 3.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(13, -7, 3.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(-10, -8.5, 1.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(14, -8.5, 1.3, 0, Math.PI*2); ctx.fill();
    }
  }
  // 鼻子
  ctx.fillStyle = gold ? "#ff9db5" : "#e58aa0";
  ctx.beginPath(); ctx.ellipse(0, 2, 6, 4.6, 0, 0, Math.PI*2); ctx.fill();
  // 嘴 + 龅牙
  if (gold) {
    ctx.strokeStyle = "#5b3a10"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 5, 6, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  } else {
    ctx.strokeStyle = "#4a2e16"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 4, 5, 0.2*Math.PI, 0.8*Math.PI); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.fillRect(-4.5, 7, 4.5, 5); ctx.fillRect(0.5, 7, 4.5, 5);
    ctx.strokeStyle = "rgba(90,60,30,.5)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0.25, 7); ctx.lineTo(0.25, 12); ctx.stroke();
  }
  // 金鼠腮红
  if (gold) {
    ctx.fillStyle = "rgba(255,130,150,.4)";
    ctx.beginPath(); ctx.arc(-19, 2, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(19, 2, 4.5, 0, Math.PI*2); ctx.fill();
  }
  // 胡须
  ctx.strokeStyle = "rgba(60,38,18,.55)"; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-24, 0); ctx.lineTo(-34, -2); ctx.moveTo(-24, 3); ctx.lineTo(-34, 4);
  ctx.moveTo(24, 0); ctx.lineTo(34, -2); ctx.moveTo(24, 3); ctx.lineTo(34, 4);
  ctx.stroke();
  ctx.restore();
}
function drawBomb(cx, cy, m) {
  var hitK = m.phase === "hit" ? Math.min(1, m.t / HIT_T) : 0;
  ctx.save();
  ctx.translate(cx, cy);
  if (hitK) ctx.scale(1 + 0.25*hitK, 1 - 0.25*hitK);
  // 红色警告光
  ctx.shadowColor = "rgba(255,64,40,.9)"; ctx.shadowBlur = 20;
  var g = ctx.createRadialGradient(-8, -10, 4, 0, 0, 32);
  g.addColorStop(0, "#4a4a58"); g.addColorStop(1, "#16161d");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  // 高光
  ctx.fillStyle = "rgba(255,255,255,.22)";
  ctx.beginPath(); ctx.ellipse(-10, -12, 8, 5, -0.6, 0, Math.PI*2); ctx.fill();
  // 引信 + 闪烁火花
  ctx.strokeStyle = "#c9a06a"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(2, -28); ctx.quadraticCurveTo(8, -38, 16, -40); ctx.stroke();
  ctx.shadowColor = "rgba(255,200,60,1)"; ctx.shadowBlur = 12;
  ctx.fillStyle = Math.random() < 0.5 ? "#ffd75e" : "#ff9d3c";
  ctx.beginPath(); ctx.arc(16 + (Math.random()*4-2), -40 + (Math.random()*4-2), 3.5 + Math.random()*2, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  // 怒目 + 怒眉
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.ellipse(-11, -6, 7, 6, 0.35, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(11, -6, 7, 6, -0.35, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#e23b2e";
  ctx.beginPath(); ctx.arc(-10, -5, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(10, -5, 3, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-18, -15); ctx.lineTo(-5, -10); ctx.moveTo(18, -15); ctx.lineTo(5, -10); ctx.stroke();
  // 锯齿嘴
  ctx.strokeStyle = "#ff6b5e"; ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(-12, 10); ctx.lineTo(-6, 14); ctx.lineTo(0, 10); ctx.lineTo(6, 14); ctx.lineTo(12, 10);
  ctx.stroke();
  ctx.restore();
}
function drawMoleAt(m, hx, hy) {
  var p = Math.max(0, Math.min(1, m.p));
  var oy = (1 - p) * 86;
  ctx.save();
  ctx.beginPath(); ctx.rect(hx - 70, hy - 170, 140, 172); ctx.clip();
  if (m.type === "bomb") drawBomb(hx, hy - 30 + oy, m);
  else drawCritter(hx, hy - 30 + oy, m);
  ctx.restore();
}
function drawHoleAndMole(h) {
  // 土堆
  ctx.fillStyle = "#8a5a33";
  ctx.beginPath(); ctx.ellipse(h.x, h.y, 60, 22, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#6e4526";
  ctx.beginPath(); ctx.ellipse(h.x, h.y - 3, 60, 20, 0, 0, Math.PI*2); ctx.fill();
  // 洞口
  ctx.fillStyle = "#2e1c0e";
  ctx.beginPath(); ctx.ellipse(h.x, h.y, 46, 15, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#1c1108";
  ctx.beginPath(); ctx.ellipse(h.x, h.y + 1, 40, 12, 0, 0, Math.PI*2); ctx.fill();
  // 地鼠（裁剪在洞口线以上）
  var m = null;
  for (var i = 0; i < moles.length; i++) if (moles[i].holeRef === h) m = moles[i];
  if (m && m.p > 0.02) drawMoleAt(m, h.x, h.y);
  // 前唇：盖住地鼠底部
  ctx.fillStyle = "#8a5a33";
  ctx.beginPath(); ctx.ellipse(h.x, h.y, 60, 22, 0, 0, Math.PI/2); ctx.fill();
  ctx.strokeStyle = "#5b3a1f"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(h.x, h.y, 59, 21, 0, 0.2, Math.PI - 0.2); ctx.stroke();
}
function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var pt = particles[i];
    var a = Math.max(0, Math.min(1, pt.life / pt.maxLife));
    if (pt.kind === "smoke") {
      ctx.globalAlpha = a * 0.5; ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * (1.6 - a*0.6), 0, Math.PI*2); ctx.fill();
    } else {
      drawStarShape(pt.x, pt.y, pt.size, pt.rot, pt.color, a);
    }
  }
  ctx.globalAlpha = 1;
}
function drawFloats() {
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (var i = 0; i < floats.length; i++) {
    var fl = floats[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, fl.life / 0.35));
    ctx.font = "800 " + (fl.size || 20) + "px -apple-system, sans-serif";
    ctx.strokeStyle = "rgba(20,30,12,.6)"; ctx.lineWidth = 4;
    ctx.strokeText(fl.text, fl.x, fl.y);
    ctx.fillStyle = fl.color;
    ctx.fillText(fl.text, fl.x, fl.y);
  }
  ctx.globalAlpha = 1;
}
function drawHammer() {
  if (hammer.t >= HAMMER_LIFE) return;
  var t = hammer.t / HAMMER_LIFE;
  var swing = t < 0.4 ? easeOut(t / 0.4) : 1;
  var ang = -1.75 + swing * 1.85;                       // 快速下摆 -100°→+6°
  var alpha = t < 0.55 ? 1 : 1 - (t - 0.55) / 0.45;
  ctx.save();
  ctx.translate(hammer.x, hammer.y + 84);
  ctx.rotate(ang);
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.fillStyle = "#c98a4b"; rr(ctx, -5, -86, 10, 66, 5); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.15)"; rr(ctx, 1, -86, 4, 66, 2); ctx.fill();
  ctx.translate(0, -86);
  var hg = ctx.createLinearGradient(0, -20, 0, 20);
  hg.addColorStop(0, "#e05548"); hg.addColorStop(1, "#a92e26");
  ctx.fillStyle = hg;
  rr(ctx, -27, -19, 54, 38, 10); ctx.fill();
  ctx.fillStyle = "#f0b429";
  rr(ctx, -6, -19, 12, 38, 3); ctx.fill();
  ctx.restore();
}
function render() {
  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random()*2-1)*shakeT*10, (Math.random()*2-1)*shakeT*10);
  // 天空 + 太阳 + 云
  var sky = ctx.createLinearGradient(0, 0, 0, 150);
  sky.addColorStop(0, "#8fd0f5"); sky.addColorStop(1, "#c9ecfb");
  ctx.fillStyle = sky; ctx.fillRect(-12, -12, W + 24, 162);
  ctx.save();
  ctx.shadowColor = "rgba(255,236,150,.9)"; ctx.shadowBlur = 30;
  ctx.fillStyle = "#ffe9a3";
  ctx.beginPath(); ctx.arc(58, 64, 26, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  for (var i = 0; i < clouds.length; i++) drawCloud(clouds[i]);
  // 草地（起伏地平线）
  var grass = ctx.createLinearGradient(0, 140, 0, H);
  grass.addColorStop(0, "#6fc457"); grass.addColorStop(1, "#3c8c35");
  ctx.fillStyle = grass;
  ctx.beginPath();
  ctx.moveTo(0, 158);
  ctx.quadraticCurveTo(W*0.25, 142, W*0.5, 152);
  ctx.quadraticCurveTo(W*0.75, 162, W, 148);
  ctx.lineTo(W, H); ctx.lineTo(0, H);
  ctx.closePath(); ctx.fill();
  for (var tI = 0; tI < tufts.length; tI++) drawTuft(tufts[tI]);
  for (var fI = 0; fI < flowers.length; fI++) drawFlower(flowers[fI]);
  // 洞口 + 地鼠（按行绘制保证遮挡正确）
  for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) drawHoleAndMole(holes[r*3 + c]);
  drawParticles();
  drawFloats();
  drawHammer();
  ctx.restore();
  // 炸弹红闪
  if (flashT > 0) { ctx.fillStyle = "rgba(255,120,80," + (flashT*0.55).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); }
}

// ---------- 主循环 ----------
var last = 0;
function frame(t) {
  var dt = Math.min((t - last) / 1000, 0.05); last = t;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- 输入（鼠标 + 触控） ----------
function toXY(clientX, clientY) {
  var rect = canvas.getBoundingClientRect();
  return { x: (clientX - rect.left) / rect.width * W, y: (clientY - rect.top) / rect.height * H };
}
canvas.addEventListener("mousedown", function (e) {
  ensureAudio();
  var p = toXY(e.clientX, e.clientY);
  whack(p.x, p.y);
});
canvas.addEventListener("touchstart", function (e) {
  e.preventDefault();
  ensureAudio();
  var t0 = e.changedTouches[0], p = toXY(t0.clientX, t0.clientY);
  whack(p.x, p.y);
}, { passive: false });

document.getElementById("playBtn").addEventListener("click", function (e) { e.stopPropagation(); startGame(); });
document.getElementById("playBtn2").addEventListener("click", function (e) { e.stopPropagation(); startGame(); });
document.addEventListener("keydown", function (e) {
  if ((e.key === "Enter" || e.key === " ") && state !== "PLAY") { e.preventDefault(); startGame(); }
});

function applyMute() {
  muteBtn.textContent = muted ? "SOUND OFF" : "SOUND ON";
  muteBtn.setAttribute("aria-pressed", String(muted));
}
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem("mw_mute", muted ? "1" : "0"); } catch (e) {}
  applyMute();
  if (!muted) { ensureAudio(); sStart(); }
}
muteBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
muteBtn.addEventListener("click", function (e) { e.stopPropagation(); toggleMute(); });

// ---------- 初始化 ----------
bestEl.textContent = String(best);
menuBestEl.textContent = "BEST " + best + (bestRank !== "-" ? " · RANK " + bestRank : "");
applyMute();
overlay.style.display = "flex";
// 调试/测试钩子（不影响游戏逻辑）
window.__mw = { get state() { return state; }, get score() { return score; }, get combo() { return combo; },
  get moles() { return moles.length; }, get timeLeft() { return timeLeft; } };
</script>
